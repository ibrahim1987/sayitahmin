# Project-wide Gradle settings.
android.useAndroidX=true

# AGP 8+ için Jetifier art?k önerilmez (derlemeyi yava?lat?r), kapat?lmas? tavsiye edilir
android.enableJetifier=false

# JVM bellek art?r?ld? (1536M -> 3072M) ve karakter kodlamas? sabitlendi
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 \
--add-exports=java.base/sun.nio.ch=ALL-UNNAMED \
--add-opens=java.base/java.lang=ALL-UNNAMED \
--add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
--add-opens=java.base/java.io=ALL-UNNAMED \
--add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
# Derleme h?z?n? art?rmak için paralel i?leme ve önbellekleme aktif edildi
org.gradle.parallel=true
org.gradle.caching=true

android.enableR8=true